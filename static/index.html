<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash-Toolkit 算法集合工具</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1 id="logo">Hash-Toolkit</h1>
      <nav id="nav"></nav>
      <footer id="sidebar-footer">本地运行 · 数据不落盘</footer>
    </aside>
    <main id="main">
      <div id="placeholder">
        <p>从左侧选择一个算法开始</p>
      </div>
      <section id="workspace" hidden>
        <h2 id="alg-name"></h2>
        <p id="alg-desc"></p>
        <form id="alg-form" novalidate></form>
        <div id="result"></div>
      </section>
    </main>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
